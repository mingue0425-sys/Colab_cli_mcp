[package]
name = "colab-cli"
version = "0.2.0"
edition = "2024"
description = "Run code on Google Colab CPU/GPU/TPU runtimes and manage Colab notebooks and Drive files from a CLI or MCP."
license = "Apache-2.0"
rust-version = "1.89"

[[bin]]
name = "colab"
path = "src/main.rs"

[dependencies]
async-tungstenite = { version = "0.32.1", default-features = false, features = ["tokio-runtime"] }
base64 = "0.22.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["json", "stream", "multipart", "query", "form"] }
rmcp = { version = "3.5.1", features = ["server", "transport-io"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.2", features = ["full"] }
url = "2.5.8"
uuid = { version = "1.27.0", features = ["v4"] }

[profile.release]
debug = 0
strip = "symbols"
lto = "thin"
codegen-units = 1
